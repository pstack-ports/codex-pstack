name: Plugin installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Codex CLI version
        id: codex-version
        run: |
          version="$(npm view @openai/codex version)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Failed to resolve @openai/codex version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "codex npm version: ${version}"
      - name: Install Codex CLI
        env:
          CODEX_VERSION: ${{ steps.codex-version.outputs.version }}
        run: |
          npm install --global "@openai/codex@${CODEX_VERSION}"
          codex --version
          {
            echo "codex npm version: ${CODEX_VERSION}"
            echo "codex --version: $(codex --version)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install the marketplace and check the bundled skills
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          root = Path.cwd()
          with tempfile.TemporaryDirectory(prefix="pstack-install-") as home:
              env = dict(os.environ, CODEX_HOME=home)

              def codex(*args):
                  result = subprocess.run(
                      ["codex", "plugin", *args, "--json"],
                      env=env, check=True, capture_output=True, text=True,
                      timeout=60,
                  )
                  return json.loads(result.stdout)

              codex("marketplace", "add", str(root))
              plugin = codex("add", "pstack@codex-pstack")
              installed = Path(plugin["installedPath"])
              manifest = json.loads((installed / ".codex-plugin/plugin.json").read_text())
              skill_root = installed / manifest["skills"]
              skills = {p.parent.name for p in skill_root.glob("*/SKILL.md")}
              required = {"poteto-mode", "setup-pstack", "deslop", "control-cli", "control-ui"}
              assert required <= skills, f"Missing skills: {required - skills}"
              for source in (root / ".agents").rglob("*"):
                  if source.is_file():
                      target = installed / source.relative_to(root)
                      assert target.read_bytes() == source.read_bytes(), f"Missing or changed: {target}"
              print(f"Installed {plugin['pluginId']} with {len(skills)} skills")
